name: Runtime CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  baseline-contract:
    name: Python 3.8 baseline contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # pinned v5 commit
        with:
          python-version: "3.8"

      - name: Report interpreter
        run: python --version

      - name: Compile Runtime tree on Python 3.8
        run: python -m compileall -q velvet_cli.py services scripts tools tests

      - name: Run Python 3.8 syntax gate
        run: python -m unittest tests.test_python38_syntax -v

      - name: Validate UP2 dependency contract
        run: python scripts/validate_up2_manifest.py

      - name: Run UP2 dependency contract tests
        run: python -m unittest tests.test_up2_dependency_manifest -v

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # pinned v5 commit
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate UP2 dependency contract
        run: python scripts/validate_up2_manifest.py

      - name: Check UP2 helper shell syntax
        run: bash -n scripts/up2_first_run.sh

      - name: Install test runner and pinned authority-contract dependencies
        run: |
          python -m pip install 'pytest>=7.4,<8.4' \
            'git+https://github.com/Velvet-ecosystem/velvet-event-protocol.git@ff2171512e1ecdbbf1e84ef727d094539ddc0b80' \
            'git+https://github.com/Velvet-ecosystem/velvet-ai-core.git@3346578c6d7d378e00b7bca42ef524cd666bf2ec' \
            'git+https://github.com/Velvet-ecosystem/velvet-vehicle-can.git@ebdd8740d85939e4de0087870b4e31c240ac9348'

      - name: Run complete test suite
        id: pytest
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python -m pytest tests -q -ra --junitxml=pytest-${{ matrix.python-version }}.xml > pytest-${{ matrix.python-version }}.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat pytest-${{ matrix.python-version }}.log
          exit 0

      - name: Generate promotion evidence
        if: always()
        run: python scripts/generate_promotion_evidence.py --repository velvet-runtime --module runtime-integration --suite pytest --command "python -m pytest tests -q -ra --junitxml=pytest-${{ matrix.python-version }}.xml" --status "${{ steps.pytest.outputs.status }}" --python "${{ matrix.python-version }}" --output "promotion-evidence-${{ matrix.python-version }}.json"

      - name: Upload promotion evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: promotion-evidence-runtime-${{ matrix.python-version }}
          path: promotion-evidence-${{ matrix.python-version }}.json

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pytest-runtime-${{ matrix.python-version }}
          path: |
            pytest-${{ matrix.python-version }}.log
            pytest-${{ matrix.python-version }}.xml

      - name: Fail on test errors
        if: steps.pytest.outputs.status != '0'
        run: |
          cat pytest-${{ matrix.python-version }}.log
          exit 1
