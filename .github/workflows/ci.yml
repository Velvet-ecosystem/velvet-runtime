name: Runtime CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  baseline-contract:
    name: Python 3.8 baseline contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # pinned v5 commit
        with:
          python-version: "3.8"

      - name: Report interpreter
        run: python --version

      - name: Compile Runtime tree on Python 3.8
        run: python -m compileall -q velvet_cli.py services scripts tools tests

      - name: Run Python 3.8 syntax gate
        run: python -m unittest tests.test_python38_syntax -v

      - name: Validate UP2 dependency contract
        run: python scripts/validate_up2_manifest.py

      - name: Run UP2 dependency contract tests
        run: python -m unittest tests.test_up2_dependency_manifest -v

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # pinned v5 commit
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate UP2 dependency contract
        run: python scripts/validate_up2_manifest.py

      - name: Check UP2 helper shell syntax
        run: bash -n scripts/up2_first_run.sh

      - name: Run unittest suite
        id: unittest
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -q > unittest-${{ matrix.python-version }}.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Generate promotion evidence
        if: always()
        run: python scripts/generate_promotion_evidence.py --repository velvet-runtime --module runtime-integration --suite unittest --status "${{ steps.unittest.outputs.status }}" --python "${{ matrix.python-version }}" --output "promotion-evidence-${{ matrix.python-version }}.json"

      - name: Upload promotion evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: promotion-evidence-runtime-${{ matrix.python-version }}
          path: promotion-evidence-${{ matrix.python-version }}.json

      - name: Upload unittest report
        if: steps.unittest.outputs.status != '0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unittest-python-${{ matrix.python-version }}
          path: unittest-${{ matrix.python-version }}.log

      - name: Fail on unittest errors
        if: steps.unittest.outputs.status != '0'
        run: |
          cat unittest-${{ matrix.python-version }}.log
          exit 1
