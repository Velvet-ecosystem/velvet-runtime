name: Runtime CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate UP2 dependency contract
        run: python scripts/validate_up2_manifest.py

      - name: Check UP2 helper shell syntax
        run: bash -n scripts/up2_first_run.sh

      - name: Run unittest suite
        run: python -m unittest discover -s tests -v
