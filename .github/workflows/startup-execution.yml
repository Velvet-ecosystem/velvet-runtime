name: Executable startup contract
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  startup:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - run: |
          python -m pip install 'pytest>=7.4,<8.4' -r requirements-test-startup.txt \
            'git+https://github.com/Velvet-ecosystem/velvet-event-protocol.git@07bf1d1c8bb1ea4d05110f5f660c60c7de30dd84' \
            'git+https://github.com/Velvet-ecosystem/velvet-ai-core.git@cc1c06782febdb89190e0ac79f156ed456e56031'
      - run: python -m pytest tests/test_startup_execution.py -q
