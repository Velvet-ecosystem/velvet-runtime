name: Vault identity acceptance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install explicit test runner
        run: python -m pip install 'pytest>=7.4,<8.4'
      - name: Install pinned authority-contract dependencies for the complete suite
        if: matrix.python-version != '3.8'
        run: |
          python -m pip install \
            'git+https://github.com/Velvet-ecosystem/velvet-event-protocol.git@ff2171512e1ecdbbf1e84ef727d094539ddc0b80' \
            'git+https://github.com/Velvet-ecosystem/velvet-ai-core.git@3346578c6d7d378e00b7bca42ef524cd666bf2ec' \
            'git+https://github.com/Velvet-ecosystem/velvet-vehicle-can.git@ebdd8740d85939e4de0087870b4e31c240ac9348'
      - name: Install disposable startup-test dependencies
        run: python -m pip install -r requirements-test-startup.txt

      - name: Founder identity and existing baseline gates
        if: matrix.python-version == '3.8'
        run: |
          python -m compileall -q velvet_cli.py services scripts tools tests
          python scripts/validate_up2_manifest.py
          python -m pytest tests/test_filesystem_identity.py tests/test_vault_resource_identity.py tests/test_body_capacity.py tests/test_headless_node_supervisor.py tests/test_body_aware_distributed_daemon.py tests/test_python38_syntax.py tests/test_up2_dependency_manifest.py -q -ra --junitxml=vault-identity-results.xml
      - name: Complete supported Runtime suite
        if: matrix.python-version != '3.8'
        run: python -m pytest tests -q -ra --junitxml=vault-identity-results.xml
      - name: Preserve executed counts and results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vault-identity-python-${{ matrix.python-version }}
          path: vault-identity-results.xml
