# velvet-runtime: config/default.yaml
# =====================================
# Default configuration for the Velvet AI Runtime.
# All values here are overridable via environment or runtime flags.
# No secrets belong here.

runtime:
  name: velvet-runtime
  version: "0.1.0"
  environment: production
  idle_loop_interval_seconds: 1

modules:
  directory: modules
  autoload: true

receipts:
  backend: jsonl
  path: receipts/receipts.jsonl
  fail_closed: true

continuity:
  required: true
  identity_chain_path: /opt/velvet/state/continuity/identity_chain.json
  proof_material_path: /opt/velvet/state/continuity/proof_material.bin
  surface_metadata_path: /opt/velvet/state/continuity/surface_identity.json
  receipt_ledger_path: /opt/velvet/state/receipts/continuity.log
  environment_overrides:
    identity_chain_path: VELVET_CONTINUITY_IDENTITY_PATH
    proof_material_path: VELVET_CONTINUITY_PROOF_PATH
    surface_metadata_path: VELVET_SURFACE_METADATA_PATH
    receipt_ledger_path: VELVET_CONTINUITY_RECEIPTS_PATH

events:
  enforce_receipt_on_actuation: true

logging:
  level: INFO
  format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
  output: stdout
  file_path: logs/velvet.log

interface:
  enabled: false
  hook: lifecycle_only

brain:
  enabled: false
  advisory_only: true
